<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ねれた">
<title>ねれた</title>
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%231B1F3B'/%3E%3Cellipse cx='50' cy='48' rx='30' ry='27' fill='%23AEB4D9'/%3E%3Crect x='38' y='58' width='24' height='20' rx='10' fill='%239AA0C8'/%3E%3Ccircle cx='40' cy='44' r='3.5' fill='%231B1F3B'/%3E%3Ccircle cx='60' cy='44' r='3.5' fill='%231B1F3B'/%3E%3C/svg%3E">
<style>
  :root{
    --night:#1B1F3B; --card:#262B52; --cream:#F4EEE2; --soft:#9AA0C8;
    --moon:#F5C87A; --indigo:#7C83D3; --sunrise:#F3A15E;
    --shadow:0 8px 24px rgba(0,0,0,.28);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:radial-gradient(120% 80% at 50% 0%, #2A2F5C 0%, var(--night) 60%);
    color:var(--cream);min-height:100vh;
    font-family:-apple-system,"Hiragino Maru Gothic ProN","Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif;
    padding:0 18px calc(92px + env(safe-area-inset-bottom));
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:460px;margin:0 auto}

  header{padding:26px 4px 6px;display:flex;align-items:baseline;gap:8px}
  header h1{font-size:24px;margin:0;letter-spacing:.06em}
  header .sub{font-size:12px;color:var(--soft)}

  .view{display:none}
  .view.active{display:block}

  /* ---- 記録タブ ---- */
  .hero{text-align:center;padding:14px 0 6px}
  .stage{position:relative;height:172px;display:flex;align-items:center;justify-content:center}
  .baku{animation:bob 3.4s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
  .zzz{position:absolute;top:24px;left:60%;color:var(--soft);font-size:20px;font-weight:700;
    opacity:0;animation:zzz 3s ease-in-out infinite}
  .zzz.b{left:68%;font-size:15px;animation-delay:.6s}
  @keyframes zzz{0%{opacity:0;transform:translateY(6px)}30%{opacity:.9}100%{opacity:0;transform:translateY(-16px)}}
  .streak{font-size:13px;color:var(--moon);font-weight:600;min-height:18px}
  .status{font-size:15px;color:var(--cream);margin:6px 0 2px;min-height:22px}
  .status b{color:var(--moon)}
  .sub-status{font-size:13px;color:var(--soft);min-height:18px}

  .action{
    margin:18px auto 4px;display:block;width:186px;height:186px;border-radius:50%;
    border:none;cursor:pointer;color:#fff;font-size:26px;font-weight:800;letter-spacing:.08em;
    box-shadow:var(--shadow);transition:transform .1s ease;position:relative;
  }
  .action:active{transform:scale(.95)}
  .action .emoji{display:block;font-size:34px;margin-bottom:4px}
  .action.sleep{background:radial-gradient(circle at 50% 35%, #8E95E6, #5860C0);
    box-shadow:0 0 0 8px rgba(124,131,211,.14), var(--shadow)}
  .action.wake{background:radial-gradient(circle at 50% 35%, #F7B877, #E4854A);
    box-shadow:0 0 0 8px rgba(243,161,94,.16), var(--shadow)}
  .undo{background:none;border:none;color:var(--soft);font-size:13px;
    text-decoration:underline;cursor:pointer;margin-top:12px;padding:6px}

  /* ---- ★評価 ---- */
  .stars{display:inline-flex;gap:8px;font-size:34px;line-height:1}
  .stars .star{cursor:pointer;color:#454A78;transition:transform .1s}
  .stars .star.on{color:var(--moon)}
  .stars .star:active{transform:scale(1.25)}
  .stars.sm{font-size:17px;gap:3px}
  .rate-wrap{margin:16px 0 2px}

  /* ---- グラフタブ ---- */
  .panel{background:var(--card);border-radius:18px;padding:18px 16px;margin-top:16px;box-shadow:var(--shadow)}
  .panel-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}
  .panel-head h2{font-size:15px;margin:0;font-weight:700}
  .avg{font-size:12px;color:var(--soft)}
  .avg b{color:var(--moon);font-size:15px}

  .seg{display:flex;background:var(--night);border-radius:10px;padding:3px;margin-bottom:16px}
  .seg button{flex:1;background:none;border:none;color:var(--soft);padding:8px;border-radius:8px;
    font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;transition:.15s}
  .seg button.on{background:var(--indigo);color:#fff}

  .chart{display:flex;align-items:flex-end;justify-content:space-between;gap:6px;height:150px}
  .chart.month{gap:2px}
  .chart.year{gap:5px}
  .col{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;height:100%;justify-content:flex-end}
  .bar-val{font-size:10px;color:var(--soft);margin-bottom:3px;height:12px;white-space:nowrap}
  .bar{width:76%;max-width:26px;background:linear-gradient(var(--indigo),#5860C0);
    border-radius:6px 6px 3px 3px;min-height:3px;transition:height .4s ease}
  .chart.month .bar{max-width:14px}
  .col.today .bar{background:linear-gradient(var(--moon),#E8A84E)}
  .bar-lbl{font-size:10px;color:var(--soft);margin-top:6px;white-space:nowrap}
  .chart.month .bar-lbl{font-size:9px}
  .col.today .bar-lbl{color:var(--moon);font-weight:700}

  .csv-btn{display:block;margin:16px auto 0;background:none;border:1px solid #3A4070;
    color:var(--moon);border-radius:999px;padding:9px 18px;font-size:13px;font-weight:600;
    font-family:inherit;cursor:pointer}
  .csv-btn:active{background:var(--card)}
  .csv-row{display:flex;gap:10px;justify-content:center;margin-top:16px;flex-wrap:wrap}
  .csv-row .csv-btn{margin:0}

  /* ---- 履歴 ---- */
  .hist-toggle{background:none;border:none;color:var(--soft);font-size:13px;cursor:pointer;
    margin:16px auto 0;display:block;padding:6px}
  .hist{display:none;margin-top:6px}
  .hist.open{display:block}
  .hrow{display:flex;flex-direction:column;gap:8px;background:var(--card);border-radius:12px;
    padding:12px 14px;margin-bottom:8px;font-size:14px}
  .hrow-main{display:flex;align-items:center;gap:10px}
  .hrow .d{color:var(--soft);font-size:13px;min-width:70px}
  .hrow .times{color:var(--soft);font-size:13px}
  .hrow .dur{font-weight:700;margin-left:auto}
  .hrow .x{background:none;border:none;color:#C98A8A;font-size:16px;cursor:pointer;padding:2px 4px}
  .empty{color:var(--soft);font-size:13px;text-align:center;padding:20px}

  /* ---- 記録を手入力 ---- */
  .manual-form{display:none;margin-top:10px;background:var(--card);border-radius:14px;
    padding:16px;box-shadow:var(--shadow)}
  .manual-form.open{display:block}
  .mf-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
  .mf-row label{font-size:13px;color:var(--soft);min-width:56px}
  .mf-row input[type=date],.mf-row input[type=time]{
    flex:1;background:var(--night);border:1px solid #3A4070;border-radius:8px;color:var(--cream);
    padding:8px 10px;font-size:14px;font-family:inherit;color-scheme:dark;min-width:0}
  .mf-error{color:#E48A8A;font-size:12px;min-height:16px;margin:-2px 0 10px}
  .mf-save{display:block;width:100%;background:linear-gradient(var(--indigo),#5860C0);border:none;
    color:#fff;font-weight:700;font-size:14px;border-radius:10px;padding:12px;cursor:pointer;
    font-family:inherit;transition:transform .1s ease}
  .mf-save:active{transform:scale(.98)}

  /* ---- 下タブ ---- */
  nav{position:fixed;bottom:0;left:0;right:0;background:rgba(27,31,59,.94);
    backdrop-filter:blur(10px);border-top:1px solid #333a66;display:flex;
    padding:8px 0 calc(8px + env(safe-area-inset-bottom))}
  nav button{flex:1;background:none;border:none;color:var(--soft);font-size:12px;
    font-family:inherit;cursor:pointer;padding:6px}
  nav button.on{color:var(--moon);font-weight:700}
  nav .ico{display:block;font-size:19px;margin-bottom:2px}

  #toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(16px);
    background:#000;color:#fff;padding:11px 20px;border-radius:999px;font-size:14px;
    opacity:0;pointer-events:none;transition:.25s;z-index:50}
  #toast.show{opacity:.92;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>ねれた</h1>
    <span class="sub">バクくんと睡眠記録</span>
  </header>

  <!-- 記録タブ -->
  <section class="view active" id="view-log">
    <div class="hero">
      <div class="stage" id="stage"></div>
      <div class="streak" id="streak"></div>
      <div class="status" id="status"></div>
      <div class="sub-status" id="subStatus"></div>
      <div id="actionArea"></div>
    </div>
  </section>

  <!-- グラフタブ -->
  <section class="view" id="view-graph">
    <div class="panel">
      <div class="panel-head">
        <h2>睡眠グラフ</h2>
        <span class="avg" id="avg"></span>
      </div>
      <div class="seg">
        <button class="on" data-p="week">1週間</button>
        <button data-p="month">1ヶ月</button>
        <button data-p="year">1年</button>
      </div>
      <div class="chart week" id="chart"></div>
    </div>
    <button class="hist-toggle" id="manualToggle">記録を手入力 ▾</button>
    <div class="manual-form" id="manualForm">
      <div class="mf-row"><label for="mfDate">日付</label><input type="date" id="mfDate"></div>
      <div class="mf-row"><label for="mfBed">就寝</label><input type="time" id="mfBed"></div>
      <div class="mf-row"><label for="mfWake">起床</label><input type="time" id="mfWake"></div>
      <div class="mf-row"><label>満足度</label><span id="mfStars"></span></div>
      <div class="mf-error" id="mfError"></div>
      <button class="mf-save" id="mfSave">保存する</button>
    </div>
    <div class="csv-row">
      <button class="csv-btn" id="csv">CSVで書き出す</button>
      <button class="csv-btn" id="importBtn">CSVを読み込む</button>
    </div>
    <input type="file" id="csvFile" accept=".csv,text/csv" hidden>
    <button class="hist-toggle" id="histToggle">記録の履歴を見る ▾</button>
    <div class="hist" id="hist"></div>
  </section>
</div>

<nav>
  <button class="on" data-view="log"><span class="ico">🌙</span>記録</button>
  <button data-view="graph"><span class="ico">📊</span>グラフ</button>
</nav>

<div id="toast"></div>

<script>
/* =========================================================
   データ層：localStorage（端末内保存）
   pending … 「寝る」だけ押したおやすみ中の途中状態
   records … 完了した睡眠（就寝・起床・睡眠分・満足度rating 0〜5）
   ========================================================= */
const KEY='nereta-v1';
let store={pending:null,records:[]};
function load(){ try{const s=JSON.parse(localStorage.getItem(KEY));if(s)store=s;}catch(e){}
  if(!store.records)store.records=[]; }
function save(){ try{localStorage.setItem(KEY,JSON.stringify(store));}catch(e){} }

let currentPeriod='week';
let ratingFor=null;   // 起床直後、★入力を促す対象レコードのid（保存はしない一時状態）

/* ---- バクくんのSVG（起きてる / 寝てる） ---- */
function bakuSVG(sleeping){
  const eyes = sleeping
    ? `<path d="M52 84 q6 6 12 0" stroke="#1B1F3B" stroke-width="3.5" fill="none" stroke-linecap="round"/>
       <path d="M86 84 q6 6 12 0" stroke="#1B1F3B" stroke-width="3.5" fill="none" stroke-linecap="round"/>`
    : `<circle cx="58" cy="84" r="4.5" fill="#1B1F3B"/><circle cx="92" cy="84" r="4.5" fill="#1B1F3B"/>
       <circle cx="59.5" cy="82.5" r="1.5" fill="#fff"/><circle cx="93.5" cy="82.5" r="1.5" fill="#fff"/>`;
  return `<svg class="baku" width="150" height="150" viewBox="0 0 150 150">
    <ellipse cx="46" cy="46" rx="12" ry="16" fill="#9AA0C8" transform="rotate(-18 46 46)"/>
    <ellipse cx="104" cy="46" rx="12" ry="16" fill="#9AA0C8" transform="rotate(18 104 46)"/>
    <path d="M75 40 q-10 -14 -2 -22 q4 8 10 6 q-2 10 -8 16 z" fill="#8288C4"/>
    <ellipse cx="75" cy="80" rx="46" ry="42" fill="#AEB4D9"/>
    <path d="M60 104 q15 16 30 0 q2 14 -15 16 q-17 -2 -15 -16 z" fill="#9198C9"/>
    <ellipse cx="68" cy="112" rx="2.4" ry="3" fill="#5B6199"/>
    <ellipse cx="82" cy="112" rx="2.4" ry="3" fill="#5B6199"/>
    <circle cx="46" cy="98" r="8" fill="#E89AA0" opacity=".7"/>
    <circle cx="104" cy="98" r="8" fill="#E89AA0" opacity=".7"/>
    ${eyes}
  </svg>`;
}

/* ---- ★（recIdを渡すとタップで変更可能） ---- */
function stars(rating,recId,sm){
  let s='';
  for(let i=1;i<=5;i++){
    const on=i<=rating;
    s+=`<span class="star ${on?'on':''}" data-star="${i}"${recId?` data-rec="${recId}"`:''}>${on?'★':'☆'}</span>`;
  }
  return `<span class="stars${sm?' sm':''}">${s}</span>`;
}

/* ---- 時間ユーティリティ ---- */
function fmtTime(iso){ const d=new Date(iso);
  return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`; }
function fmtDur(min){ const h=Math.floor(min/60),m=min%60; return m?`${h}時間${m}分`:`${h}時間`; }
/* ---- 「睡眠の夜」の日付：就寝が正午より前なら前日の夜として数える（深夜0時またぎ対策） ---- */
function nightDate(iso){
  const d=new Date(iso);
  if(d.getHours()<12) d.setDate(d.getDate()-1);
  d.setHours(0,0,0,0);
  return d;
}
function nightKey(iso){ const d=nightDate(iso); return `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`; }

/* ---- 連続記録日数（睡眠の夜ベース。今日 or 昨日を起点に、空きなく続く日数） ---- */
function calcStreak(){
  const days=new Set(store.records.map(r=>nightKey(r.bedtime)));
  const cursor=new Date(); cursor.setHours(0,0,0,0);
  const todayKey=`${cursor.getFullYear()}-${cursor.getMonth()+1}-${cursor.getDate()}`;
  if(!days.has(todayKey)) cursor.setDate(cursor.getDate()-1);   // 今日未記録なら昨日を起点に
  let count=0;
  while(days.has(`${cursor.getFullYear()}-${cursor.getMonth()+1}-${cursor.getDate()}`)){
    count++; cursor.setDate(cursor.getDate()-1);
  }
  return count;
}
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg;
  t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),1800); }

/* ---- ボタンの動き ---- */
function goSleep(){ store.pending={bedtime:new Date().toISOString()}; save(); render(); toast('おやすみ🌙 よく眠れますように'); }
function goWake(){
  if(!store.pending) return;
  const bed=new Date(store.pending.bedtime), wake=new Date();
  let min=Math.round((wake-bed)/60000);
  if(min<0) min=0; if(min>24*60) min=24*60;
  const rec={id:Date.now().toString(36),bedtime:store.pending.bedtime,
    waketime:wake.toISOString(),minutes:min,rating:0};
  store.records.push(rec);
  store.pending=null; ratingFor=rec.id;   // 起床直後は★入力画面へ
  save(); render();
}
function setRating(recId,val){
  const rec=store.records.find(r=>r.id===recId); if(!rec) return;
  rec.rating=val; save();
  if(ratingFor===recId){ ratingFor=null; toast('記録したよ、おつかれさま☺️'); }
  render();
}
function undoSleep(){ store.pending=null; save(); render(); toast('「寝る」を取り消しました'); }
function delRecord(id){ store.records=store.records.filter(r=>r.id!==id);
  if(ratingFor===id) ratingFor=null; save(); render(); }

/* =========================================================
   描画
   ========================================================= */
function render(){
  const stage=document.getElementById('stage');
  const streak=document.getElementById('streak');
  const status=document.getElementById('status');
  const subStatus=document.getElementById('subStatus');
  const area=document.getElementById('actionArea');

  const streakDays=calcStreak();
  streak.textContent=streakDays>0?`🔥 ${streakDays}日連続`:'';

  if(store.pending){
    stage.innerHTML=bakuSVG(true)+`<span class="zzz">Z</span><span class="zzz b">z</span>`;
    status.innerHTML=`<b>おやすみ中…</b>`;
    subStatus.textContent=`${fmtTime(store.pending.bedtime)} に寝ました`;
    area.innerHTML=`<button class="action wake" id="btn"><span class="emoji">☀️</span>起きた</button>
                    <button class="undo" id="undo">「寝る」を取り消す</button>`;
    document.getElementById('btn').onclick=goWake;
    document.getElementById('undo').onclick=undoSleep;

  }else if(ratingFor){
    const rec=store.records.find(r=>r.id===ratingFor);
    stage.innerHTML=bakuSVG(false);
    status.innerHTML=`おはよう☀️ <b>${fmtDur(rec.minutes)}</b> ねれたね`;
    subStatus.textContent='よく寝れた？ ★で記録しよう';
    area.innerHTML=`<div class="rate-wrap">${stars(rec.rating||0, rec.id)}</div>
                    <button class="undo" id="skip">あとで</button>`;
    document.getElementById('skip').onclick=()=>{ ratingFor=null; render(); };

  }else{
    stage.innerHTML=bakuSVG(false);
    const last=store.records[store.records.length-1];
    status.textContent=last?'おはよう！今日も記録しよう':'はじめまして、バクくんだよ';
    subStatus.innerHTML=last?`前回は <b style="color:var(--moon)">${fmtDur(last.minutes)}</b> ねれたね`:'寝るときにボタンを押してね';
    area.innerHTML=`<button class="action sleep" id="btn"><span class="emoji">🌙</span>寝る</button>`;
    document.getElementById('btn').onclick=goSleep;
  }
  renderChart();
  renderHist();
}

/* 期間ごとにグラフ用データを組み立てる */
function periodData(period){
  const dayMap={};
  store.records.forEach(r=>{ const k=nightKey(r.bedtime); dayMap[k]=(dayMap[k]||0)+r.minutes; });
  let bars=[];
  if(period==='week'||period==='month'){
    const n=period==='week'?7:30;
    for(let i=n-1;i>=0;i--){
      const d=new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate()-i);
      const k=`${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`;
      const today=i===0;
      if(period==='week') bars.push({label:`${d.getMonth()+1}/${d.getDate()}`,min:dayMap[k]||0,today,showLabel:true,showVal:true});
      else bars.push({label:`${d.getDate()}`,min:dayMap[k]||0,today,showLabel:(i%5===0)||today,showVal:false});
    }
  }else{ // 1年：直近12ヶ月、1晩あたりの平均睡眠
    const mMin={},mNights={},seen={};
    store.records.forEach(r=>{ const d=nightDate(r.bedtime); const mk=`${d.getFullYear()}-${d.getMonth()}`;
      mMin[mk]=(mMin[mk]||0)+r.minutes;
      const nk=mk+'-'+d.getDate(); if(!seen[nk]){seen[nk]=1; mNights[mk]=(mNights[mk]||0)+1;} });
    for(let i=11;i>=0;i--){
      const d=new Date(); d.setDate(1); d.setMonth(d.getMonth()-i);
      const mk=`${d.getFullYear()}-${d.getMonth()}`; const nights=mNights[mk]||0;
      bars.push({label:`${d.getMonth()+1}月`, min:nights?Math.round(mMin[mk]/nights):0, today:i===0, showLabel:true, showVal:true});
    }
  }
  const withData=bars.filter(b=>b.min>0);
  const avgMin=withData.length?Math.round(withData.reduce((s,b)=>s+b.min,0)/withData.length):0;
  return {bars,avgMin};
}
function renderChart(){
  const {bars,avgMin}=periodData(currentPeriod);
  const chart=document.getElementById('chart');
  chart.className='chart '+currentPeriod;
  const maxMin=Math.max(8*60, ...bars.map(b=>b.min));
  chart.innerHTML=bars.map(b=>{
    const h=b.min?Math.max(3,Math.round(b.min/maxMin*118)):3;
    const val=(b.showVal&&b.min)?(b.min/60).toFixed(1):'';
    return `<div class="col ${b.today?'today':''}">
      <div class="bar-val">${val}</div>
      <div class="bar" style="height:${h}px"></div>
      <div class="bar-lbl">${b.showLabel?b.label:''}</div>
    </div>`;
  }).join('');
  const withData=bars.filter(b=>b.min>0);
  document.getElementById('avg').innerHTML=withData.length?`平均 <b>${fmtDur(avgMin)}</b>`:'記録がまだないよ';
}
function renderHist(){
  const box=document.getElementById('hist');
  if(store.records.length===0){ box.innerHTML='<div class="empty">まだ記録がありません</div>'; return; }
  const days=['日','月','火','水','木','金','土'];
  box.innerHTML=store.records.slice().reverse().map(r=>{
    const d=new Date(r.bedtime);
    return `<div class="hrow">
      <div class="hrow-main">
        <span class="d">${d.getMonth()+1}/${d.getDate()}(${days[d.getDay()]})</span>
        <span class="times">${fmtTime(r.bedtime)} → ${fmtTime(r.waketime)}</span>
        <span class="dur">${fmtDur(r.minutes)}</span>
        <button class="x" data-del="${r.id}">×</button>
      </div>
      ${stars(r.rating||0, r.id, true)}
    </div>`;
  }).join('');
}

/* ---- CSV書き出し ---- */
function csvCell(v){ v=(v==null?'':String(v)); if(/[",\r\n]/.test(v)) v='"'+v.replace(/"/g,'""')+'"'; return v; }
function exportCsv(){
  if(store.records.length===0){ toast('記録がありません'); return; }
  const days=['日','月','火','水','木','金','土'];
  const rows=[['日付','曜日','就寝','起床','睡眠時間(分)','睡眠時間','満足度(★)']];
  store.records.forEach(r=>{ const d=new Date(r.bedtime);
    rows.push([`${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()}`, days[d.getDay()],
      fmtTime(r.bedtime), fmtTime(r.waketime), r.minutes, fmtDur(r.minutes), r.rating||'']); });
  const csv='\uFEFF'+rows.map(c=>c.map(csvCell).join(',')).join('\r\n');
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});
  const url=URL.createObjectURL(blob); const a=document.createElement('a');
  const t=new Date(); const st=`${t.getFullYear()}${String(t.getMonth()+1).padStart(2,'0')}${String(t.getDate()).padStart(2,'0')}`;
  a.href=url; a.download=`nereta_${st}.csv`; document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url); toast('CSVを書き出しました');
}

/* ---- CSV読み込み（別ブラウザ・別端末からデータを移す用） ---- */
// 1行を「,」で分割（"で囲まれた項目にも対応）
function splitCsvLine(line){
  const out=[]; let cur='', q=false;
  for(let i=0;i<line.length;i++){ const ch=line[i];
    if(q){ if(ch==='"'){ if(line[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=ch; }
    else { if(ch===','){out.push(cur);cur='';} else if(ch==='"'){q=true;} else cur+=ch; }
  }
  out.push(cur); return out.map(s=>s.trim());
}
// 1行 → レコード（就寝ISO・起床ISO・睡眠分・満足度を復元）
function rowToRecord(dateStr,bedT,wakeT,minStr,rateStr){
  const dm=(dateStr||'').split(/[\/\-]/).map(Number);
  if(dm.length<3||dm.some(isNaN)) return null;
  const [by,bmo,bd]=dm;
  const [bh,bmin]=(bedT||'').split(':').map(Number);
  const [wh,wmin]=(wakeT||'').split(':').map(Number);
  if([bh,bmin,wh,wmin].some(isNaN)) return null;
  const bed=new Date(by,bmo-1,bd,bh,bmin);
  let wake=new Date(by,bmo-1,bd,wh,wmin);
  if(wake<=bed) wake=new Date(wake.getTime()+86400000);   // 日をまたぐ睡眠
  let minutes=parseInt(minStr,10);
  if(isNaN(minutes)) minutes=Math.round((wake-bed)/60000);
  let rating=parseInt(rateStr,10); if(isNaN(rating)) rating=0;
  rating=Math.max(0,Math.min(5,rating));
  return {id:'imp'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),
    bedtime:bed.toISOString(), waketime:wake.toISOString(), minutes, rating};
}
// CSV全体をパース（ヘッダー名で列を探すので、多少列がずれても動く）
function parseCsv(text){
  text=text.replace(/^\uFEFF/,'');                        // 先頭のBOMを除去
  const lines=text.split(/\r?\n/).filter(l=>l.trim());
  if(lines.length<2) return [];
  const header=splitCsvLine(lines[0]);
  const col=n=>header.indexOf(n);
  const iD=col('日付'), iB=col('就寝'), iW=col('起床'), iM=col('睡眠時間(分)'), iR=col('満足度(★)');
  const recs=[];
  for(let i=1;i<lines.length;i++){
    const c=splitCsvLine(lines[i]);
    const r=rowToRecord(c[iD], c[iB], c[iW], iM>=0?c[iM]:'', iR>=0?c[iR]:'');
    if(r) recs.push(r);
  }
  return recs;
}
// 取り込み（同じ就寝時刻・睡眠時間のものは重複としてスキップ）
function importRecords(newRecs){
  const key=r=>{ const b=new Date(r.bedtime);
    return `${b.getFullYear()}-${b.getMonth()}-${b.getDate()}-${b.getHours()}-${b.getMinutes()}-${r.minutes}`; };
  const seen=new Set(store.records.map(key));
  let added=0,skip=0;
  newRecs.forEach(r=>{ const k=key(r);
    if(seen.has(k)){skip++;} else {store.records.push(r); seen.add(k); added++;} });
  store.records.sort((a,b)=> new Date(a.bedtime)-new Date(b.bedtime));  // 就寝時刻順に整列
  save(); render();
  toast(`${added}件を取り込みました${skip?`（重複${skip}件はスキップ）`:''}`);
}

/* ---- 記録を手入力（ボタン押し忘れた日を後から埋める） ---- */
let manualRating=0, manualDupConfirm=false;
function renderManualStars(){ document.getElementById('mfStars').innerHTML=stars(manualRating,null,true); }
function resetManualForm(){
  const t=new Date();
  document.getElementById('mfDate').value=
    `${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,'0')}-${String(t.getDate()).padStart(2,'0')}`;
  document.getElementById('mfBed').value='';
  document.getElementById('mfWake').value='';
  manualRating=0; manualDupConfirm=false;
  renderManualStars();
  document.getElementById('mfError').textContent='';
}
function toggleManualForm(){
  const form=document.getElementById('manualForm');
  const willOpen=!form.classList.contains('open');
  form.classList.toggle('open');
  document.getElementById('manualToggle').textContent=willOpen?'記録を手入力 ▴':'記録を手入力 ▾';
  if(willOpen) resetManualForm();
}
function closeManualForm(){
  document.getElementById('manualForm').classList.remove('open');
  document.getElementById('manualToggle').textContent='記録を手入力 ▾';
}
function saveManualRecord(){
  const err=document.getElementById('mfError');
  const dateStr=document.getElementById('mfDate').value;
  const bedStr=document.getElementById('mfBed').value;
  const wakeStr=document.getElementById('mfWake').value;
  if(!dateStr||!bedStr||!wakeStr){ err.textContent='日付・就寝・起床をすべて入力してください'; manualDupConfirm=false; return; }
  const [y,mo,d]=dateStr.split('-').map(Number);
  const [bh,bmin]=bedStr.split(':').map(Number);
  const [wh,wmin]=wakeStr.split(':').map(Number);
  const bed=new Date(y,mo-1,d,bh,bmin);
  let wake=new Date(y,mo-1,d,wh,wmin);
  if(wake<=bed) wake=new Date(wake.getTime()+86400000);   // 起床が就寝より早ければ翌日扱い
  const minutes=Math.round((wake-bed)/60000);
  if(minutes>24*60){ err.textContent='睡眠時間が24時間を超えています'; manualDupConfirm=false; return; }
  if(bed.getTime()>Date.now()){ err.textContent='未来の日付は記録できません'; manualDupConfirm=false; return; }
  const isDup=store.records.some(r=> new Date(r.bedtime).getTime()===bed.getTime() && r.minutes===minutes);
  if(isDup && !manualDupConfirm){
    err.textContent='同じ記録がすでにあります。もう一度押すと保存します';
    manualDupConfirm=true;
    return;
  }
  const rec={id:'man'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),
    bedtime:bed.toISOString(), waketime:wake.toISOString(), minutes, rating:manualRating};
  store.records.push(rec);
  store.records.sort((a,b)=> new Date(a.bedtime)-new Date(b.bedtime));   // 就寝時刻順に整列
  save();
  closeManualForm();
  render();
  toast('記録を保存したよ');
}

/* ---- 固定要素のイベント（1回だけ登録） ---- */
document.addEventListener('click',e=>{               // ★タップ（記録画面・履歴・手入力フォーム）
  const st=e.target.closest('.star');
  if(!st) return;
  if(st.dataset.rec) setRating(st.dataset.rec, parseInt(st.dataset.star,10));
  else if(st.closest('#mfStars')){ manualRating=parseInt(st.dataset.star,10); renderManualStars(); }
});
document.querySelectorAll('.seg button').forEach(b=> b.onclick=()=>{
  currentPeriod=b.dataset.p;
  document.querySelectorAll('.seg button').forEach(x=>x.classList.toggle('on', x===b));
  renderChart();
});
document.querySelectorAll('nav button').forEach(b=> b.onclick=()=>{
  document.querySelectorAll('nav button').forEach(x=>x.classList.remove('on')); b.classList.add('on');
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.getElementById('view-'+b.dataset.view).classList.add('active');
});
document.getElementById('csv').onclick=exportCsv;
document.getElementById('importBtn').onclick=()=>document.getElementById('csvFile').click();
document.getElementById('csvFile').onchange=e=>{
  const f=e.target.files[0]; if(!f) return;
  const reader=new FileReader();
  reader.onload=()=>{
    try{ const recs=parseCsv(reader.result);
      if(recs.length===0) toast('読み込める行がありませんでした');
      else importRecords(recs);
    }catch(err){ toast('読み込みに失敗しました'); }
    e.target.value='';   // 同じファイルをもう一度選べるようにリセット
  };
  reader.readAsText(f);
};
document.getElementById('manualToggle').onclick=toggleManualForm;
document.getElementById('mfSave').onclick=saveManualRecord;
['mfDate','mfBed','mfWake'].forEach(id=>{
  document.getElementById(id).oninput=()=>{ manualDupConfirm=false; document.getElementById('mfError').textContent=''; };
});
document.getElementById('hist').addEventListener('click',e=>{ if(e.target.dataset.del) delRecord(e.target.dataset.del); });
document.getElementById('histToggle').onclick=function(){
  const h=document.getElementById('hist'); h.classList.toggle('open');
  this.textContent=h.classList.contains('open')?'履歴を閉じる ▴':'記録の履歴を見る ▾';
};

/* ---- 起動 ---- */
load();
render();
</script>
